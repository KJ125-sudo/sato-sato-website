<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sato Sato — Inside</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#0D1C35">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #0D1C35;
      --midnight: #080F1C;
      --cream: #FAFAF5;
      --blue: #1B3F7A;
      --mid: #2D5FA6;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(45, 95, 166, 0.35), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 90%, rgba(27, 63, 122, 0.4), transparent 50%),
        linear-gradient(165deg, var(--midnight) 0%, var(--night) 55%, #122646 100%);
      display: grid;
      place-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .gate {
      width: min(100%, 420px);
      text-align: center;
    }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(250, 250, 245, 0.45);
      margin-bottom: 18px;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

    .copy {
      font-size: 0.95rem;
      line-height: 1.55;
      color: rgba(250, 250, 245, 0.65);
      margin-bottom: 32px;
    }

    form {
      display: grid;
      gap: 12px;
    }

    input[type="password"] {
      width: 100%;
      appearance: none;
      border: 1px solid rgba(250, 250, 245, 0.18);
      background: rgba(8, 15, 28, 0.55);
      color: var(--cream);
      font: inherit;
      font-size: 1rem;
      letter-spacing: 0.08em;
      padding: 14px 16px;
      border-radius: 0;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    input[type="password"]::placeholder {
      color: rgba(250, 250, 245, 0.35);
      letter-spacing: 0.04em;
    }

    input[type="password"]:focus {
      border-color: rgba(250, 250, 245, 0.55);
      background: rgba(8, 15, 28, 0.75);
    }

    button {
      appearance: none;
      border: 0;
      background: var(--cream);
      color: var(--night);
      font: inherit;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 15px 18px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    button:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .error {
      margin-top: 16px;
      font-size: 0.875rem;
      color: #ffb4b4;
      min-height: 1.25em;
    }

    .error[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main class="gate">
    <p class="eyebrow">Private</p>
    <h1>Inside</h1>
    <p class="copy">Enter the shared password to open the Sato Sato brand bible.</p>
    <form id="inside-login" method="post" action="/api/inside-login" autocomplete="current-password">
      <input
        type="password"
        name="password"
        id="password"
        placeholder="Password"
        required
        autofocus
        autocomplete="current-password"
      >
      <button type="submit">Enter</button>
    </form>
    <p class="error" id="error" hidden>Incorrect password. Try again.</p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const errorEl = document.getElementById('error');
    if (params.get('error') === '1') {
      errorEl.hidden = false;
    }

    const form = document.getElementById('inside-login');
    form.addEventListener('submit', () => {
      form.querySelector('button').disabled = true;
    });
  </script>
</body>
</html>
